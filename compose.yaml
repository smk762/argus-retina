# argus-retina's detectors, published on loopback only. To serve the LAN, set RETINA_BIND=0.0.0.0 in .env
# (the servers have no auth: keep them on a trusted network).
#   docker compose up -d                      # the released images
#   docker compose build && docker compose up -d   # from source, after `make weights`
#   docker compose --profile gpu up -d        # SingGuard too (the one GPU image)

services:
  nudenet:
    image: ghcr.io/smk762/argus-retina-nudenet:${RETINA_TAG:-latest}
    build:
      context: .
      dockerfile: images/nudenet/Dockerfile
    restart: unless-stopped
    ports:
      - "${RETINA_BIND:-127.0.0.1}:${NUDENET_PORT:-8130}:8080"

  erax:
    image: ghcr.io/smk762/argus-retina-erax:${RETINA_TAG:-latest}
    build:
      context: .
      dockerfile: images/erax/Dockerfile
    restart: unless-stopped
    ports:
      - "${RETINA_BIND:-127.0.0.1}:${ERAX_PORT:-8131}:8080"

  watermark:
    # No weights in the image: `make watermark-weights` fetches fancyfeast's YOLO11x to the path mounted here
    # (or point WATERMARK_WEIGHTS at your own copy).
    image: ghcr.io/smk762/argus-retina-watermark:${RETINA_TAG:-latest}
    build:
      context: .
      dockerfile: images/watermark/Dockerfile
    restart: unless-stopped
    volumes:
      # Long form so a missing file is an error: the short form would create a root-owned directory at that path,
      # which then blocks `make watermark-weights`.
      - type: bind
        source: ${WATERMARK_WEIGHTS:-./images/watermark/weights/watermark.pt}
        target: /models/watermark.pt
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${RETINA_BIND:-127.0.0.1}:${WATERMARK_PORT:-8132}:8080"

  ocr:
    image: ghcr.io/smk762/argus-retina-ocr:${RETINA_TAG:-latest}
    build:
      context: .
      dockerfile: images/ocr/Dockerfile
    restart: unless-stopped
    ports:
      - "${RETINA_BIND:-127.0.0.1}:${OCR_PORT:-8133}:8080"

  singguard:
    # The one GPU image, so it starts only with `docker compose --profile gpu up -d`. No weights in the image: the
    # first start fetches SingGuard-4b (8.9 GB) into the volume and checks every file's sha256; later starts reuse it.
    # Set ARGUS_ADMIN_TOKEN so only argus-iris can unload it.
    image: ghcr.io/smk762/argus-retina-singguard:${RETINA_TAG:-latest}
    build:
      context: .
      dockerfile: images/singguard/Dockerfile
    profiles: ["gpu"]
    restart: unless-stopped
    environment:
      - SINGGUARD_QUANT=${SINGGUARD_QUANT:-4bit}
      - SINGGUARD_FORCE_THINKING=${SINGGUARD_FORCE_THINKING:-}
      - ARGUS_ADMIN_TOKEN=${ARGUS_ADMIN_TOKEN:-}
    volumes:
      - singguard_weights:/models/singguard
    gpus: all
    ports:
      - "${RETINA_BIND:-127.0.0.1}:${SINGGUARD_PORT:-8134}:8080"

volumes:
  singguard_weights:
