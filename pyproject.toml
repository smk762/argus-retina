[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "argus-retina"
dynamic = ["version"]
description = "Shared detector servers for the Argus suite: NudeNet, EraX, watermark and guard models behind one HTTP contract"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "smk762" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "structlog>=24.0",
]

[project.optional-dependencies]
# What every image's server needs; each image adds its own detector (images/<model>/requirements.txt).
server = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
]
dev = [
    "argus-retina[server]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff==0.15.16",
    # Tests check /health against cortex's ResidentHealth and the manifests against TenantManifest.
    # ResidentHealth is on cortex's dev, not yet released: pinned to that commit until cortex 0.7.
    "argus-cortex[yaml] @ git+https://github.com/smk762/argus-cortex@0cee4d0412e62946ba8aa37f3cf8ed080e2bbc5f",
]

[project.urls]
Repository = "https://github.com/smk762/argus-retina"

[tool.hatch.metadata]
allow-direct-references = true  # the dev extra's argus-cortex pin; nothing here is published to PyPI

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/argus_retina/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_retina"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/argus_retina/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
