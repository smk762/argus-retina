# argus-iris tenant manifest for argus-retina-c2pa. Validated by argus-cortex's TenantManifest
# (gpu-tenant-schema.json) in tests/test_images.py.
#
# The reader runs on the CPU (CUDA_VISIBLE_DEVICES is empty): it never takes a lease or holds VRAM.
# It keeps no GPU resident.
tenant_version: "1.0"
tenant: argus-retina-c2pa
description: C2PA manifest reader on the CPU. The signed claims and the library's validation state; no verdict.
repo: smk762/argus-retina
kinds:
  - kind: c2pa
    vram_mb: 0
    priority: interactive
    preemptible: false
    description: One /c2pa call (one or more images), on the CPU.
residents: []
