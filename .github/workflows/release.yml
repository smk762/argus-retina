name: Release images

# On a v* tag: one image per model, ghcr.io/<owner>/argus-retina-<model>, built from the tagged commit of this
# public repo (AGPL section 13; /health names the commit). Then the GitHub Release, with the tag's CHANGELOG.md
# section as its notes.
#
# Nothing goes to PyPI: the package is only the images' shared server code, and nothing outside this repo should
# import it (callers talk HTTP; their clients live in argus_cortex.moderation).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  notes:
    # First, so a tag without its CHANGELOG section fails before any image is pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [${version}]" 'index($0, head) == 1 {found = 1; next} found && /^## \[/ {exit} found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  image:
    needs: notes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [nudenet, erax, watermark, ocr, synthetic, c2pa, singguard, faces]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch weights
        if: matrix.image == 'nudenet'  # the only image that bakes in a release asset
        # NudeNet's release assets need an authenticated download; the Makefile checks the sha256.
        env:
          GH_TOKEN: ${{ github.token }}
        run: make weights
      - name: Free disk space
        if: matrix.image == 'singguard'  # torch's CUDA wheels make a 9.4 GB image; the runner starts with about 14 GB free
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/argus-retina-${{ matrix.image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/${{ matrix.image }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  github-release:
    # Last, once every image is in the registry.
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          case "$tag" in *-*|*rc*|*a[0-9]*|*b[0-9]*|*dev*) prerelease="--prerelease" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" --verify-tag --title "$tag" --notes-file notes.md $prerelease
          fi
